# ══════════════════════════════════════════════════════════════════════════════
# Velozz CRM — Deploy para Produção
#
# Pipeline completo com:
#   - Lint + Testes
#   - Bundle
#   - Snapshot da versão atual (para rollback)
#   - Deploy via clasp push
#   - Smoke test via GAS Execution API
#   - Tag git automática
#   - Rollback automático em caso de falha
#   - Notificação por e-mail
# ══════════════════════════════════════════════════════════════════════════════

name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "appsscript.json"
      - "package.json"

  # Permite trigger manual pelo GitHub UI (útil para rollback manual)
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Forçar deploy mesmo sem mudanças de código"
        required: false
        default: "false"
        type: boolean
      skip_tests:
        description: "Pular testes (emergência — use com cuidado)"
        required: false
        default: "false"
        type: boolean

# Garante que apenas um deploy rode por vez
concurrency:
  group: deploy-production
  cancel-in-progress: false # NÃO cancela deploys em andamento

env:
  NODE_VERSION: "20"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Qualidade — Lint + Testes
  # ────────────────────────────────────────────────────────────────────────────
  quality:
    name: 🔍 Qualidade (Lint + Testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para git describe (versão)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Verificar cobertura mínima
        run: |
          # Extrai cobertura do relatório JSON
          COVERAGE=$(node -e "
            const report = require('./coverage/coverage-summary.json');
            const total = report.total;
            const min = Math.min(
              total.lines.pct,
              total.functions.pct,
              total.branches.pct,
              total.statements.pct
            );
            console.log(min.toFixed(1));
          ")
          echo "📊 Cobertura mínima: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Cobertura abaixo do mínimo de 80%"
            exit 1
          fi
          echo "✅ Cobertura aceitável"

      - name: Upload cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Bundle
  # ────────────────────────────────────────────────────────────────────────────
  bundle:
    name: 📦 Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: quality
    # Roda mesmo se quality foi pulado (skip_tests)
    if: always() && (needs.quality.result == 'success' || needs.quality.result == 'skipped')

    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Obter versão atual
        id: get-version
        run: |
          # Tenta pegar a git tag mais recente; fallback para package.json
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || \
                    node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versão do bundle: $VERSION"

      - name: Executar bundle
        run: npm run bundle

      - name: Validar bundle gerado
        run: |
          EXPECTED=(
            "00_AppConfig.gs" "01_Logger.gs" "02_LockManager.gs"
            "03_Formatter.gs" "04_DocumentValidator.gs" "05_SheetService.gs"
            "06_FormService.gs" "07_TagService.gs" "08_ContactService.gs"
            "09_SyncOrchestrator.gs" "10_TriggerHandlers.gs"
            "SetupTenantDialog.html" "appsscript.json"
          )
          for FILE in "${EXPECTED[@]}"; do
            [ ! -f "dist/$FILE" ] && echo "❌ Ausente: dist/$FILE" && exit 1
            echo "✓ dist/$FILE"
          done
          echo "✅ Bundle válido."

      - name: Upload do bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy → Google Apps Script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: bundle
    environment:
      name: production
      url: https://script.google.com/d/${{ secrets.SCRIPT_ID }}/edit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Download do bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-${{ github.sha }}
          path: dist/

      # ── Configura credenciais do clasp ─────────────────────────────────
      - name: Configurar credenciais clasp
        run: |
          # CLASP_TOKEN é o JSON completo do .clasprc.json
          # Gerado localmente com: clasp login
          # Salvo no GitHub como secret CLASP_TOKEN
          echo '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
          echo "✅ Credenciais clasp configuradas"

      # ── Configura .clasp.json com o SCRIPT_ID do secret ───────────────
      - name: Configurar .clasp.json
        run: |
          cat > .clasp.json << EOF
          {
            "scriptId": "${{ secrets.SCRIPT_ID }}",
            "rootDir": "dist"
          }
          EOF
          echo "✅ .clasp.json configurado"

      # ── Snapshot da versão atual para rollback ─────────────────────────
      - name: Snapshot — Salvar versão atual do GAS
        id: snapshot
        run: |
          # Cria uma versão numerada no GAS antes de sobreescrever
          # Isso permite rollback via: clasp version [numero]
          SNAPSHOT_DESC="Pre-deploy snapshot — $(date -u '+%Y-%m-%d %H:%M:%S UTC') — SHA: ${{ github.sha }}"
          echo "📸 Criando snapshot: $SNAPSHOT_DESC"

          # Tenta criar versão; não falha se der erro (script pode ser novo)
          VERSION_OUTPUT=$(npx clasp version "$SNAPSHOT_DESC" 2>&1) || true
          echo "Snapshot output: $VERSION_OUTPUT"

          # Extrai número da versão criada para uso no rollback
          VERSION_NUM=$(echo "$VERSION_OUTPUT" | grep -oP '(?<=Created version )\d+' || echo "0")
          echo "snapshot_version=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "📸 Snapshot criado: versão $VERSION_NUM"

      # ── Deploy via clasp push ──────────────────────────────────────────
      - name: Deploy — clasp push
        id: clasp-push
        run: |
          echo "🚀 Iniciando deploy para Script ID: ${{ secrets.SCRIPT_ID }}"
          echo "📦 Versão: ${{ needs.bundle.outputs.version }}"
          echo ""

          npx clasp push --force
          PUSH_EXIT=$?

          if [ $PUSH_EXIT -ne 0 ]; then
            echo "❌ clasp push falhou com código $PUSH_EXIT"
            exit $PUSH_EXIT
          fi

          echo "✅ clasp push concluído com sucesso"

      # ── Smoke test via GAS Execution API ──────────────────────────────
      # Executa uma função simples no GAS para confirmar que o script
      # foi atualizado e está executável
      - name: Smoke Test — Executar função de verificação no GAS
        id: smoke-test
        run: |
          echo "🔬 Executando smoke test via GAS Execution API..."

          # Extrai o access_token do CLASP_TOKEN
          ACCESS_TOKEN=$(echo '${{ secrets.CLASP_TOKEN }}' | \
            node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              console.log(data.token.access_token);
            ")

          # Chama a função 'onOpen' (segura — apenas cria menu, sem side effects)
          # ⚠️ A GAS Execution API só funciona se o script tiver sido deployado
          # como API executable. Para projetos vinculados a Sheets, usar
          # uma função utilitária específica de smoke test.
          RESPONSE=$(curl -s -X POST \
            "https://script.googleapis.com/v1/scripts/${{ secrets.SCRIPT_ID }}:run" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "function": "onOpen",
              "devMode": false
            }' 2>&1) || true

          echo "Resposta da API: $RESPONSE"

          # Verifica se houve erro crítico (não de execução, mas de autenticação/quota)
          if echo "$RESPONSE" | grep -q '"error"'; then
            ERROR_STATUS=$(echo "$RESPONSE" | \
              node -e "
                const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                console.log(d.error?.status || 'UNKNOWN');
              " 2>/dev/null || echo "PARSE_ERROR")

            # PERMISSION_DENIED pode ser esperado se script não for API executable
            # Nesses casos, o deploy ainda foi bem-sucedido
            if [ "$ERROR_STATUS" = "PERMISSION_DENIED" ] || \
               [ "$ERROR_STATUS" = "UNAUTHENTICATED" ]; then
              echo "⚠️ Smoke test retornou $ERROR_STATUS — deploy OK mas API exec não configurada."
              echo "💡 Para smoke tests completos, configure o script como API executable."
            else
              echo "❌ Smoke test falhou: $ERROR_STATUS"
              exit 1
            fi
          else
            echo "✅ Smoke test passou"
          fi

      # ── Cria versão GAS pós-deploy ─────────────────────────────────────
      - name: Versionar deployment no GAS
        run: |
          VERSION_DESC="v${{ needs.bundle.outputs.version }} — $(date -u '+%Y-%m-%d %H:%M:%S UTC') — SHA: ${{ github.sha }}"
          npx clasp version "$VERSION_DESC" || true
          echo "📌 Versão GAS criada: $VERSION_DESC"

      # ── Tag git ────────────────────────────────────────────────────────
      - name: Criar tag git do deploy
        run: |
          VERSION="${{ needs.bundle.outputs.version }}"
          TAG="deploy-$(date -u '+%Y%m%d%H%M%S')"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Deploy $VERSION em $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin "$TAG"
          echo "🏷️  Tag criada: $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Rollback automático em caso de falha no deploy
  # ────────────────────────────────────────────────────────────────────────────
  rollback:
    name: ⏪ Rollback Automático
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    # Só executa se o deploy falhou
    if: failure() && needs.deploy.result == 'failure'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Configurar credenciais clasp
        run: |
          echo '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Configurar .clasp.json
        run: |
          cat > .clasp.json << EOF
          {
            "scriptId": "${{ secrets.SCRIPT_ID }}",
            "rootDir": "dist"
          }
          EOF

      - name: Executar rollback para última versão estável
        run: |
          echo "⏪ Iniciando rollback automático..."

          # Lista as versões disponíveis do script GAS
          VERSIONS=$(npx clasp versions 2>&1)
          echo "Versões disponíveis:"
          echo "$VERSIONS"

          # Extrai o número da versão mais recente ANTES do deploy falho
          # O snapshot criado no job deploy tem "Pre-deploy" na descrição
          ROLLBACK_VERSION=$(echo "$VERSIONS" | \
            grep "Pre-deploy" | \
            tail -1 | \
            grep -oP '^\d+' || echo "")

          if [ -z "$ROLLBACK_VERSION" ] || [ "$ROLLBACK_VERSION" = "0" ]; then
            echo "⚠️ Nenhuma versão de snapshot encontrada para rollback."
            echo "Rollback manual necessário via: npx clasp deploy"
            exit 1
          fi

          echo "🔄 Fazendo rollback para versão GAS: $ROLLBACK_VERSION"
          npx clasp deploy --versionNumber "$ROLLBACK_VERSION" \
            --description "ROLLBACK automático — falha em ${{ github.sha }}"

          echo "✅ Rollback concluído para versão $ROLLBACK_VERSION"

      - name: Notificar rollback
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "⏪ [Velozz CRM] Rollback executado — ${{ github.sha }}"
          to: ${{ secrets.ALERT_EMAIL }}
          body: |
            ⏪ ROLLBACK AUTOMÁTICO EXECUTADO

            O deploy falhou e o rollback foi ativado automaticamente.

            Detalhes:
            • SHA do commit: ${{ github.sha }}
            • Branch: ${{ github.ref_name }}
            • Autor: ${{ github.actor }}
            • Horário: ${{ github.event.head_commit.timestamp }}

            Verifique os logs completos em:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            — Velozz CRM CI/CD

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5: Notificação de sucesso
  # ────────────────────────────────────────────────────────────────────────────
  notify-success:
    name: 📬 Notificar Sucesso
    runs-on: ubuntu-latest
    # ✅ I added `bundle` to the needs array here:
    needs: [deploy, bundle]

    if: success()

    steps:
      - name: Notificar deploy bem-sucedido
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✅ [Velozz CRM] Deploy concluído — v${{ needs.bundle.outputs.version }}"
          to: ${{ secrets.ALERT_EMAIL }}
          body: |
            ✅ DEPLOY CONCLUÍDO COM SUCESSO

            Velozz CRM foi atualizado em produção.

            Detalhes:
            • Versão: v${{ needs.bundle.outputs.version }}
            • SHA: ${{ github.sha }}
            • Branch: ${{ github.ref_name }}
            • Autor: ${{ github.actor }}
            • Horário: ${{ github.event.head_commit.timestamp }}

            Acesse o projeto GAS:
            https://script.google.com/d/${{ secrets.SCRIPT_ID }}/edit

            Logs do pipeline:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
